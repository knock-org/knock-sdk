<!doctype html>
<!--
  Example: a plain HTML page using the knockai CDN install.

  Replace YOUR_TAG_ID with your website tag's id (on a marketing site) or
  your product tag's id (in a logged-in app).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>knockai example</title>

    <!-- Loads the SDK. Same as pasting the snippet from the README. -->
    <script src="https://cdn.jsdelivr.net/npm/knockai@0.1/dist/snippet.js"></script>
    <script>knockai.init({ tagId: 'YOUR_TAG_ID' });</script>
  </head>
  <body>
    <h1>knockai example</h1>

    <button id="book-demo" type="button">Book a demo</button>

    <form id="demo-form">
      <input name="email" type="email" placeholder="you@company.com" required />
      <input name="firstName" type="text" placeholder="First name" />
      <button type="submit">Send</button>
    </form>

    <script>
      // Opens your default Knock modal. Pass { magicLinkId: '...' } for a specific one.
      document.getElementById('book-demo').addEventListener('click', function () {
        knock.modal.open();
      });

      // No need to wait for the SDK: calls made before it's ready are queued.
      document.getElementById('demo-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var data = new FormData(event.target);
        knock.identify({
          email: data.get('email'),
          firstName: data.get('firstName') || undefined,
        });
        knock.track('demo_form_submitted');
      });
    </script>
  </body>
</html>
